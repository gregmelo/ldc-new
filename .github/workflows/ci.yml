name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Tests Backend ───────────────────────────────────────────────
  test-backend:
    name: Tests PHPUnit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, pdo_mysql
          coverage: none

      - name: Installer les dépendances Composer
        working-directory: backend
        run: composer install --no-interaction --prefer-dist

      - name: Créer .env.test
        working-directory: backend
        run: |
          echo "LDC_DB_HOST=127.0.0.1" >> .env.test
          echo "LDC_DB_NAME=ldc_test" >> .env.test
          echo "LDC_DB_USER=root" >> .env.test
          echo "LDC_DB_PASS=" >> .env.test
          echo "LDC_APP_SECRET=test_secret_key_for_phpunit" >> .env.test
          echo "LDC_ALLOWED_ORIGIN=http://localhost" >> .env.test

      - name: Lancer les tests PHPUnit
        working-directory: backend
        run: vendor/bin/phpunit --display-deprecations

  # ─── Tests & Build Frontend ──────────────────────────────────────
  test-frontend:
    name: Tests Vitest + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances npm
        working-directory: frontend
        run: npm install

      - name: Lancer les tests Vitest
        working-directory: frontend
        run: npm run test:run

      - name: Créer .env.local pour le build
        working-directory: frontend
        run: echo "VITE_API_URL=https://vericelgregory.alwaysdata.net/ldc/backend/public/index.php" > .env.local

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Uploader le build en artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  # ─── Déploiement ─────────────────────────────────────────────────
  deploy:
    name: Déploiement Alwaysdata
    runs-on: ubuntu-latest
    needs: [ test-backend, test-frontend ]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Télécharger le build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Configurer SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan ssh-vericelgregory.alwaysdata.net >> ~/.ssh/known_hosts

      - name: Déployer le frontend via scp
        run: |
          scp dist/index.html vericelgregory@ssh-vericelgregory.alwaysdata.net:www/ldc/
          scp dist/assets/* vericelgregory@ssh-vericelgregory.alwaysdata.net:www/ldc/assets/

      - name: Checkout pour le backend
        uses: actions/checkout@v4

      - name: Déployer le backend via scp
        run: |
          scp -r backend/src/* vericelgregory@ssh-vericelgregory.alwaysdata.net:www/ldc/backend/src/
          scp -r backend/public/* vericelgregory@ssh-vericelgregory.alwaysdata.net:www/ldc/backend/public/